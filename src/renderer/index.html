<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Ultimate Hub</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <nav id="sidebar">
      <header id="brand">
        <svg id="logo" viewBox="0 0 32 32" width="18" height="18" aria-hidden="true"><rect width="32" height="32" rx="7.2" fill="#2f5bd3" /><path d="M6.5 9v9.75a4.25 4.25 0 0 0 8.5 0V9M18.5 9v14M25.5 9v14M18.5 16h7" fill="none" stroke="#eef1f7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <h1>Ultimate Hub</h1>
        <div class="header-buttons">
          <button id="terminal-toggle" aria-label="Show terminal" title="Show terminal (⌃`)" aria-pressed="false" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 4.5 6.5 8 3 11.5M8.5 12H13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <button id="search-open" aria-label="Search running instances" title="Search running instances (⌘⇧F)" aria-haspopup="dialog">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M10 10l4.25 4.25" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
          <button id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Hide sidebar" title="Hide sidebar (⇧⌘B)">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" /><path d="M6.25 3v10" stroke="currentColor" stroke-width="1.4" /></svg>
          </button>
        </div>
      </header>
      <section class="part">
        <header class="part-header">
          <h2 id="top-title">Ultimates</h2>
          <button id="add" aria-label="Add" title="Add" aria-haspopup="menu">+</button>
        </header>
        <ul id="top" role="tablist" aria-labelledby="top-title" aria-orientation="vertical"></ul>
      </section>
      <section class="part" id="status-part">
        <header class="part-header"><h2 id="status-title">Status</h2></header>
        <ul id="status" role="listbox" aria-labelledby="status-title"></ul>
      </section>
      <div id="rail-part">
        <ul id="rail" role="tablist" aria-label="Ultimates" aria-orientation="vertical"></ul>
        <div class="edge top" id="rail-above" hidden></div>
        <div class="edge bottom" id="rail-below" hidden></div>
      </div>
    </nav>
    <main id="message"></main>
    <div id="split" role="separator" aria-orientation="horizontal" aria-label="Terminal height" hidden></div>
    <dialog id="name-dialog" aria-labelledby="name-title">
      <form>
        <h2 id="name-title"></h2>
        <label>Name <input id="name-input" autocomplete="off" spellcheck="false" aria-describedby="name-refusal" /></label>
        <p id="name-refusal" role="alert" hidden></p>
        <div class="buttons">
          <button type="button" id="name-cancel">Cancel</button>
          <button id="name-ok"></button>
        </div>
      </form>
    </dialog>
    <dialog id="sheet" aria-labelledby="sheet-title" aria-describedby="sheet-text">
      <div class="sheet-panel">
        <button id="sheet-x" type="button" aria-label="Close" title="Close"></button>
        <h2 id="sheet-title"><span id="sheet-icon"></span><span id="sheet-title-text"></span></h2>
        <p id="sheet-text"></p>
        <div id="sheet-path"></div>
        <div class="sheet-buttons">
          <button type="button" id="sheet-cancel">Cancel</button>
          <button type="button" id="sheet-action"></button>
        </div>
      </div>
    </dialog>
    <dialog id="search" aria-labelledby="search-title">
      <h2 id="search-title">Search running instances</h2>
      <input
        id="search-input"
        role="combobox"
        aria-labelledby="search-title"
        aria-controls="search-results"
        aria-expanded="true"
        aria-autocomplete="list"
        autocomplete="off"
        spellcheck="false"
      />
      <ul id="search-results" role="listbox" aria-labelledby="search-title"></ul>
      <p id="search-empty" hidden></p>
      <p id="search-count" role="status" class="spoken"></p>
    </dialog>
    <script type="module" src="./shell.ts"></script>
  </body>
</html>
